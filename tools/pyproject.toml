[project]
name = "e2eat"
version = "0.1.0"
description = "Deterministic helpers for the E2E Agent Tester multi-agent system"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "jinja2>=3.1"]

[project.scripts]
e2eat = "e2eat.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2eat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # long lines: the prompts' JSON examples and f-strings are clearer unwrapped
    "B008",  # runner_with_timeout(...) as a default is evaluated once on purpose: it builds a stateless runner
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]

[tool.mypy]
python_version = "3.12"
files = ["src/e2eat"]
ignore_missing_imports = true
warn_unused_ignores = true
